name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate-and-release:
    name: Validate & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches the CMake project version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION=$(sed -n 's/^project(rikugan VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          IDA=$(sed -n 's/.*"version": "\([0-9.]*\)".*/\1/p' ida-plugin.json | head -n1)
          echo "Tag: $TAG  |  CMakeLists.txt: $VERSION  |  ida-plugin.json: $IDA"
          if [ "$TAG" != "$VERSION" ] || [ "$TAG" != "$IDA" ]; then
            echo "ERROR: tag v$TAG does not match the project version"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
