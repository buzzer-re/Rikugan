name: CI

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Native tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: omc (libomc source)
        uses: actions/checkout@v4
        with:
          repository: buzzer-re/Oh-My-C
          path: ohmyc

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libssl-dev zlib1g-dev libarchive-tools \
            libgl-dev libegl-dev libxkbcommon-dev libfontconfig1-dev python3

      - name: Qt 6.11.1 headers and tools (Binary Ninja's Qt)
        run: tools/fetch_qt.sh 6.11.1 "$HOME/Qt"

      - name: Configure
        run: cmake -S . -B build/none -G Ninja -DRIKUGAN_HOST=none -DOMC_DIR="$PWD/ohmyc" -DCMAKE_PREFIX_PATH="$HOME/Qt/6.11.1/gcc_64"

      - name: Build
        run: cmake --build build/none

      - name: Test
        run: ctest --test-dir build/none --output-on-failure
